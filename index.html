    <script>
      (function () {
        // Tamanho do "Page Down": ~90% da altura da viewport
        function pageStep() {
          return Math.round(window.innerHeight * 0.9);
        }

        // Cria o botão de descer
        const downBtn = document.createElement("button");
        downBtn.className = "scroll-btn";
        downBtn.setAttribute("aria-label", "Descer uma página");
        downBtn.innerHTML = "▼";
        document.body.appendChild(downBtn);

        function pgDown() {
          window.scrollBy({ top: pageStep(), left: 0, behavior: "smooth" });
        }
        function pgUp() {
          window.scrollBy({ top: -pageStep(), left: 0, behavior: "smooth" });
        }

        // Clique para descer
        downBtn.addEventListener("click", pgDown, { passive: true });

        // (Opcional) Pressionar e segurar ~0.6s faz subir
        let holdTimer = null;
        downBtn.addEventListener(
          "touchstart",
          () => {
            holdTimer = setTimeout(pgUp, 600);
          },
          { passive: true }
        );
        ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach((ev) =>
          downBtn.addEventListener(ev, () => clearTimeout(holdTimer), {
            passive: true,
          })
        );

        // (Opcional) Habilita também PageUp/PageDown no teclado
        document.addEventListener("keydown", (e) => {
          if (e.key === "PageDown") pgDown();
          if (e.key === "PageUp") pgUp();
        });

        // ====== OPCIONAL: criar também um botão "subir" dedicado (empilhado acima) ======
        const upBtn = document.createElement("button");
        upBtn.className = "scroll-btn up";
        upBtn.setAttribute("aria-label", "Subir uma página");
        upBtn.innerHTML = "▲";
        document.body.appendChild(upBtn);
        upBtn.addEventListener("click", pgUp, { passive: true });
      })();
    </script>
